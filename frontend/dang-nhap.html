<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - StudyGroup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main); background-image: radial-gradient(circle at 20% 80%, rgba(232, 185, 109, 0.05) 0%, transparent 50%); }
        .auth-card { background: var(--bg-card); padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-md); border: 2px solid var(--border-light); width: 100%; max-width: 400px; }
        .auth-title { text-align: center; font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .auth-subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; font-style: italic; }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-btn { width: 100%; margin-top: 8px; }
        .auth-link { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 16px; }
        .auth-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-title">Đăng nhập</div>
        <div class="auth-subtitle">Chào mừng bạn trở lại với StudyGroup!</div>
        
        <form class="auth-form" id="form-dang-nhap">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="email" placeholder="Nhập email của bạn" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-input" id="mat-khau" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary auth-btn" id="btn-submit">Đăng nhập</button>
        </form>
        
        <div class="auth-link">
            Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a>
        </div>
        <div class="auth-link" style="margin-top: 8px;">
            <a href="index.html" style="color: var(--text-muted);">← Quay về trang chủ</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('form-dang-nhap').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const mat_khau = document.getElementById('mat-khau').value;
            const btn = document.getElementById('btn-submit');
            
            btn.textContent = 'Đang xử lý...';
            btn.disabled = true;

            try {
                const data = await apiCall('/dang-nhap', {
                    method: 'POST',
                    body: JSON.stringify({ email, mat_khau })
                });

                if (data.error) {
                    showToast(data.error, 'error');
                } else {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showToast('Đăng nhập thành công! Đang vào hệ thống...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                }
            } catch (err) {
                showToast('Lỗi kết nối máy chủ!', 'error');
            } finally {
                btn.textContent = 'Đăng nhập';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
