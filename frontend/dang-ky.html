<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - StudyGroup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main); background-image: radial-gradient(circle at 20% 80%, rgba(232, 185, 109, 0.05) 0%, transparent 50%); }
        .auth-card { background: var(--bg-card); padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-md); border: 2px solid var(--border-light); width: 100%; max-width: 400px; }
        .auth-title { text-align: center; font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; }
        .auth-subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; font-style: italic; }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-btn { width: 100%; margin-top: 8px; }
        .auth-link { text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 16px; }
        .auth-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-title">Tạo tài khoản</div>
        <div class="auth-subtitle">Bắt đầu hành trình học tập của bạn</div>
        
        <form class="auth-form" id="form-dang-ky">
            <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" class="form-input" id="ho-ten" placeholder="VD: Nguyễn Văn A" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mã sinh viên</label>
                <input type="text" class="form-input" id="ma-sinh-vien" placeholder="VD: SV2024001" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="email" placeholder="Nhập email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-input" id="mat-khau" placeholder="Tạo mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary auth-btn" id="btn-submit">Đăng ký</button>
        </form>
        
        <div class="auth-link">
            Đã có tài khoản? <a href="dang-nhap.html">Đăng nhập</a>
        </div>
        <div class="auth-link" style="margin-top: 8px;">
            <a href="index.html" style="color: var(--text-muted);">← Quay về trang chủ</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('form-dang-ky').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            
            const payload = {
                ho_ten: document.getElementById('ho-ten').value,
                ma_sinh_vien: document.getElementById('ma-sinh-vien').value,
                email: document.getElementById('email').value,
                mat_khau: document.getElementById('mat-khau').value
            };

            btn.textContent = 'Đang xử lý...';
            btn.disabled = true;

            try {
                const data = await apiCall('/dang-ky', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (data.error) {
                    showToast(data.error, 'error');
                } else {
                    showToast('Đăng ký thành công! Đang chuyển hướng...', 'success');
                    setTimeout(() => window.location.href = 'dang-nhap.html', 1500);
                }
            } catch (err) {
                showToast('Lỗi kết nối máy chủ!', 'error');
            } finally {
                btn.textContent = 'Đăng ký';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
